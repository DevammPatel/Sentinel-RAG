name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: |
          pip install -r requirements-dev.txt
          pip install -e . --no-deps
      - name: Lint
        run: ruff check src tests scripts
      - name: Test (offline; no keys, no model downloads)
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sentinel-rag:ci .
      - name: Container answers a question
        run: |
          docker run -d --name app -p 7860:7860 sentinel-rag:ci
          for i in $(seq 1 30); do
            curl -fsS localhost:7860/health && break
            sleep 2
          done
          curl -fsS localhost:7860/query -H 'content-type: application/json' \
            -d '{"question":"How quickly must a bank close a credit card after a closure request?"}' \
            | tee answer.json
          python - <<'PY'
          import json
          body = json.load(open("answer.json"))
          assert not body["refused"], body
          assert any("seven working days" in s["text"] for s in body["sources"]), body
          PY
      - name: Logs on failure
        if: failure()
        run: docker logs app
